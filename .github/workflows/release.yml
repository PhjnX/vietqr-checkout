name: Release

# Push a tag such as v1.0.1 to build the installable zip and publish a GitHub release:
#   git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' vietqr-checkout.php | awk '{print $NF}')
          if [ "$TAG" != "$HEADER" ]; then
            echo "Tag $TAG does not match plugin header version $HEADER" && exit 1
          fi

      - name: Build zip
        # git archive honours .gitattributes export-ignore, so tests and tooling stay out.
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=vietqr-checkout/ -o dist/vietqr-checkout.zip HEAD
          unzip -l dist/vietqr-checkout.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/vietqr-checkout.zip --title "$GITHUB_REF_NAME" --generate-notes
